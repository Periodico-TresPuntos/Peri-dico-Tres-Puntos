<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos | Tres Puntos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Cabecera del periódico -->
    <header class="bg-white border-b border-gray-300 py-6 text-center">
        <h1 class="text-4xl md:text-5xl font-serif tracking-widest text-gray-900 font-bold">TRES PUNTOS</h1>
        <p class="text-xs tracking-widest text-gray-500 uppercase mt-1">No esperes, el suspenso... continuará</p>
    </header>

    <!-- Barra de Navegación / Secciones -->
    <nav class="bg-gray-900 text-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-center gap-4 text-xs font-semibold tracking-wider">
            <a href="index.html" class="hover:text-red-400">PORTADA</a>
            <a href="cine-y-series.html" class="hover:text-red-400">CINE Y SERIES</a>
            <a href="mundo-actoral.html" class="hover:text-red-400">MUNDO ACTORAL</a>
            <a href="gaming.html" class="hover:text-red-400">GAMING</a>
            <a href="esports.html" class="hover:text-red-400">ESPORTS</a>
            <a href="musica.html" class="hover:text-red-400">MÚSICA</a>
            <a href="literatura.html" class="hover:text-red-400">LITERATURA</a>
            <a href="eventos.html" class="text-red-500 hover:text-red-400">EVENTOS</a>
            <a href="tecnologia.html" class="hover:text-red-400">TECNOLOGÍA</a>
            <a href="ciencia.html" class="hover:text-red-400">CIENCIA</a>
            <a href="deportes.html" class="hover:text-red-400">DEPORTES</a>
            <a href="local.html" class="hover:text-red-400">LOCAL</a>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="mb-8 border-b border-gray-300 pb-4">
            <h2 id="titulo-seccion" class="text-3xl font-serif font-bold text-gray-900 uppercase">Eventos</h2>
            <p class="text-xs text-gray-500 mt-1">Artículos y publicaciones recientes</p>
        </div>

        <div id="noticias-container" class="space-y-8">
            <!-- Contenido dinámico -->
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="text-center py-6 text-gray-400 text-xs mt-12 border-t border-gray-200">
        <p>Tres Puntos &copy; 2026 | No esperes, el suspenso... continuará</p>
    </footer>

    <!-- Script de carga -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const nombreSeccion = "Eventos"; 

            fetch('noticias.json')
                .then(response => response.json())
                .then(data => {
                    const contenedor = document.getElementById('noticias-container');
                    contenedor.innerHTML = "";

                    const articulosFiltrados = data.articulos.filter(art => 
                        art.seccion && art.seccion.trim().toLowerCase() === nombreSeccion.toLowerCase()
                    );

                    if (articulosFiltrados.length === 0) {
                        contenedor.innerHTML = `
                            <div class="bg-white p-6 rounded shadow border border-gray-200 text-center">
                                <p class="text-gray-500 italic text-sm">De momento no hay noticias en esta sección, por favor busque en las demás o espere a la fecha de publicación de esta, muchas gracias.</p>
                            </div>
                        `;
                        return;
                    }

                    articulosFiltrados.forEach(art => {
                        const fechaFormateada = art.date ? new Date(art.date).toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
                        const div = document.createElement('div');
                        div.className = "bg-white rounded shadow p-6 md:p-8 border border-gray-200";
                        
                        div.innerHTML = `
                            ${art.destacado ? '<div class="inline-block bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider mb-3">Destacado</div>' : ''}
                            <h3 class="text-2xl font-serif font-bold text-gray-900 mb-2">${art.title}</h3>
                            ${fechaFormateada ? `<p class="text-xs text-gray-400 mb-4">${fechaFormateada}</p>` : ''}
                            ${art.image ? `<div class="mb-4 overflow-hidden rounded max-h-96"><img src="${art.image}" alt="${art.title}" class="w-full h-auto object-cover"></div>` : ''}
                            <div class="text-gray-600 text-base leading-relaxed space-y-3">
                                <p>${art.body || ''}</p>
                            </div>
                        `;
                        contenedor.appendChild(div);
                    });
                });
        });
    </script>
</body>
</html>
