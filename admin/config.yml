backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "portada"
    label: "Portada del Periódico"
    files:
      - file: "index.html"
        label: "Editar Portada"
        name: "index"
        fields:
          - {label: "Título de la Noticia Destacada", name: "titulo_destacado", widget: "string"}
          - {label: "Texto del Destacado", name: "texto_destacado", widget: "text"}

  - name: "secciones"
    label: "Secciones del Periódico"
    files:
      - file: "noticias.json"
        label: "Ciencia"
        name: "ciencia"
        fields:
          - label: "Artículos de Ciencia"
            name: "articulos"
            widget: "list"
            fields:
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Sección fija", name: "seccion", widget: "hidden", default: "Ciencia"}
              - {label: "¿Destacado?", name: "destacado", widget: "boolean", default: false, required: false}
              - {label: "Fecha", name: "date", widget: "datetime"}
              - {label: "Imagen", name: "image", widget: "image", required: false}
              - {label: "Contenido", name: "body", widget: "markdown"}

      - file: "noticias.json"
        label: "Gaming"
        name: "gaming"
        fields:
          - label: "Artículos de Gaming"
            name: "articulos"
            widget: "list"
            fields:
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Sección fija", name: "seccion", widget: "hidden", default: "Gaming"}
              - {label: "¿Destacado?", name: "destacado", widget: "boolean", default: false, required: false}
              - {label: "Fecha", name: "date", widget: "datetime"}
              - {label: "Imagen", name: "image", widget: "image", required: false}
              - {label: "Contenido", name: "body", widget: "markdown"}

      - file: "noticias.json"
        label: "Deportes"
        name: "deportes"
        fields:
          - label: "Artículos de Deportes"
            name: "articulos"
            widget: "list"
            fields:
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Sección fija", name: "seccion", widget: "hidden", default: "Deportes"}
              - {label: "¿Destacado?", name: "destacado", widget: "boolean", default: false, required: false}
              - {label: "Fecha", name: "date", widget: "datetime"}
              - {label: "Imagen", name: "image", widget: "image", required: false}
              - {label: "Contenido", name: "body", widget: "markdown"}
