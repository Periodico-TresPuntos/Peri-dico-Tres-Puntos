<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tres Puntos - Local </title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería para leer Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- CABECERA -->
    <header class="bg-white border-b border-gray-300 py-6 text-center">
        <div class="container mx-auto px-4">
            <a href="index.html" class="text-3xl md:text-5xl font-serif font-bold tracking-wider text-black">TRES PUNTOS</a>
            <p class="text-xs italic text-gray-600 mt-1">"No esperes, el suspenso... continuará"</p>
        </div>
    </header>

    <!-- MENÚ DE NAVEGACIÓN -->
    <nav class="bg-black text-white sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-4 flex flex-wrap justify-center items-center gap-4 py-3 text-xs md:text-sm uppercase tracking-wider">
            <a href="index.html" class="hover:text-red-400 transition">Portada</a>
            <span>|</span>
            <a href="cine-y-series.html" class="hover:text-red-400 transition">Cine y Series</a>
            <span>|</span>
            <a href="mundo-actoral.html" class="hover:text-red-400 transition">Mundo Actoral</a>
            <span>|</span>
            <a href="gaming.html" class="hover:text-red-400 transition">Gaming</a>
            <span>|</span>
            <a href="esports.html" class="hover:text-red-400 transition">eSports</a>
            <span>|</span>
            <a href="musica.html" class="hover:text-red-400 transition">Música</a>
            <span>|</span>
            <a href="literatura.html" class="hover:text-red-400 transition">Literatura</a>
            <span>|</span>
            <a href="eventos.html" class="hover:text-red-400 transition">Eventos</a>
            <span>|</span>
            <a href="tecnologia.html" class="hover:text-red-400 transition">Tecnología</a>
            <span>|</span>
            <a href="ciencia.html" class="hover:text-red-400 transition">Ciencia</a>
            <span>|</span>
            <a href="deportes.html" class="hover:text-red-400 transition">Deportes</a>
            <span>|</span>
            <a href="local.html" class="hover:text-red-400 transition">Local</a>
        </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL DE LA SECCIÓN -->
    <main class="max-w-4xl mx-auto p-6 mt-6">
        <!-- NOMBRE DE LA SECCIÓN -->
        <h2 id="nombre-seccion" class="text-3xl font-serif font-bold border-b-2 border-black pb-2 mb-6 uppercase"> Local </h2>
        <p class="text-sm text-gray-600 mb-8" id="descripcion-seccion">Actualidad, sucesos y emprendimientos desde Maracaibo.</p>
        
        <!-- LISTA DINÁMICA DE NOTICIAS -->
        <div id="lista-noticias" class="space-y-8">
            <p class="text-gray-500 italic">Cargando publicaciones...</p>
        </div>
    </main>

    <!-- SCRIPT DE CARGA AUTOMÁTICA -->
    <script>
        const path = window.location.pathname;
        const filename = path.substring(path.lastIndexOf('/') + 1).replace('.html', '');
        
        const seccionesMap = {
            "ciencia": "Ciencia",
            "cine-y-series": "Cine y Series",
            "deportes": "Deportes",
            "esports": "eSports",
            "eventos": "Eventos",
            "gaming": "Gaming",
            "literatura": "Literatura",
            "local": "Local",
            "mundo-actoral": "Mundo Actoral",
            "musica": "Música",
            "tecnologia": "Tecnología"
        };

        const seccionActual = seccionesMap[filename] || "General";
        document.getElementById('nombre-seccion').innerText = seccionActual;

        async function cargarNoticias() {
            const contenedor = document.getElementById('lista-noticias');
            try {
                const respuesta = await fetch('/noticias.json');
                if (!respuesta.ok) throw new Error("No se encontró el archivo de datos.");
                
                const datos = await respuesta.json();
                const articulos = datos.articulos || [];

                // Filtramos las noticias que pertenecen a esta sección exacta
                const filtrados = articulos.filter(art => art.seccion === seccionActual);

                if (filtrados.length === 0) {
                    contenedor.innerHTML = `<div class="bg-white p-6 rounded shadow border border-gray-200 text-center"><p class="text-gray-500 italic">Aún no hay noticias publicadas en ${seccionActual}. ¡Usa el panel de administración para agregar la primera!</p></div>`;
                    return;
                }

                // Dibujamos las noticias respetando el orden y formato periodístico
                contenedor.innerHTML = filtrados.map((art, index) => `
                    <article class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Noticia #${index + 1}</span>
                            ${art.destacado ? '<span class="bg-black text-white text-xs font-bold px-2 py-0.5 rounded uppercase">★ Destacado</span>' : ''}
                        </div>
                        <h3 class="text-2xl font-serif font-bold text-gray-900 mb-2">${art.title}</h3>
                        <p class="text-xs text-gray-500 mb-4">Publicado: ${art.date ? new Date(art.date).toLocaleDateString() : 'Reciente'}</p>
                        
                        ${art.image ? `<img src="${art.image}" alt="Imagen de la noticia" class="mb-4 rounded max-h-96 w-full object-cover shadow-inner">` : ''}
                        
                        <div class="text-gray-800 leading-relaxed space-y-3 prose">
                            ${marked.parse(art.body || '')}
                        </div>
                    </article>
                `).join('');

            } catch (error) {
                console.error(error);
                contenedor.innerHTML = '<div class="bg-white p-6 rounded shadow border border-gray-200 text-center"><p class="text-gray-600">Publica tu primera noticia desde el panel de administración para verla reflejada aquí automáticamente.</p></div>';
            }
        }

        cargarNoticias();
    </script>
</body>
</html>
